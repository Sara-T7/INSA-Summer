<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="card">
  <h1>Create your account</h1>
  <p class="subtitle">It only takes a minute</p>

  <div id="googleBtn"></div>

  <div class="divider">or sign up with email</div>

  <form id="registerForm">
    <label for="name">Name</label>
    <input type="text" id="name" autocomplete="name">

    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="new-password">
    <div class="strength-meter"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="strength-hint" id="strengthHint">At least 8 characters, upper &amp; lowercase, a number, and a symbol.</div>

    <button type="submit" class="primary" id="submitBtn">Create Account</button>
  </form>

  <div class="error-box" id="errorBox"></div>

  <p class="footer-link">Already have an account? <a href="index.html">Sign in</a></p>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
